<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Live</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --sunk: #eef0f4; --ink: #1b2130; --muted: #5f6a80; --line: #dde1e8;
    --blue: #2563eb; --green: #15803d; --amber: #b45309; --red: #c2410c; --gray: #7b8496; --violet: #7c3aed; --teal: #0f766e;
    --blue-bg: #e8effd; --green-bg: #e7f5ec; --amber-bg: #fdf3e3; --red-bg: #fdece4; --violet-bg: #f1eafe; --teal-bg: #e3f4f1;
    --mine: #2563eb; --mine-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a; --card: #191e28; --sunk: #222936; --ink: #e8ebf1; --muted: #9aa3b5; --line: #2c3442;
      --blue: #7aa2ff; --green: #5ccf8d; --amber: #f0b45a; --red: #ff8a65; --gray: #7f889b; --violet: #b69bff; --teal: #5fd0c0;
      --blue-bg: #1c2a4a; --green-bg: #173326; --amber-bg: #3a2c15; --red-bg: #3d2119; --violet-bg: #2b2148; --teal-bg: #133430;
      --mine: #2f5bd3; --mine-ink: #fff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; }

  /* ---- Top bar */
  .top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  h1 { font-size: 17px; margin: 0; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); }
  .dot.on { background: var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .modes { margin-left: auto; display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; }
  .modes button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgb(0 0 0 / .15); }

  /* ---- Two panes: conversations | chat */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr); }
  .list { min-height: 0; overflow: auto; border-right: 1px solid var(--line); background: var(--card); }
  .chat { min-height: 0; display: flex; flex-direction: column; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .app.reading .list, .app:not(.reading) .chat { display: none; }
  }

  .waiting { margin: 10px; padding: 8px 12px; border-radius: 10px; background: var(--amber-bg); color: var(--amber); font-size: 13px; font-weight: 600; }
  .group { padding: 14px 16px 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .conv { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; padding: 9px 16px; border: 0; background: none; text-align: left; cursor: pointer; }
  .conv:hover { background: var(--sunk); }
  .conv[aria-current="true"] { background: var(--blue-bg); }
  .conv .av { grid-row: span 2; align-self: center; }
  .conv .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .when { font-size: 12px; color: var(--muted); text-align: right; }
  .conv .prev { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .prev.typing { color: var(--blue); font-style: italic; }
  .conv .side { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  /* A run is a thread: the open one shows its batches and tasks indented beneath it. */
  .conv.run[aria-expanded="true"] { background: var(--sunk); }
  .conv.run[aria-expanded="true"][aria-current="true"] { background: var(--blue-bg); }
  .thread { margin: 0 0 8px 24px; border-left: 2px solid var(--line); }
  .thread .group { padding-left: 12px; }
  .thread .conv { padding-left: 12px; }
  .chev { display: inline-block; width: 12px; color: var(--muted); font-size: 11px; }
  .badge { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 700; text-align: center; }

  /* Avatars: a task's ring shows its state; a speaker's colour stays the same everywhere. */
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
  .av.sm { width: 32px; height: 32px; font-size: 13px; }
  .ring-blue { box-shadow: 0 0 0 2px var(--blue); } .ring-green { box-shadow: 0 0 0 2px var(--green); }
  .ring-amber { box-shadow: 0 0 0 2px var(--amber); } .ring-red { box-shadow: 0 0 0 2px var(--red); } .ring-gray { box-shadow: 0 0 0 2px var(--line); }
  .c-blue { color: var(--blue); background: var(--blue-bg); } .c-green { color: var(--green); background: var(--green-bg); }
  .c-amber { color: var(--amber); background: var(--amber-bg); } .c-red { color: var(--red); background: var(--red-bg); }
  .c-violet { color: var(--violet); background: var(--violet-bg); } .c-teal { color: var(--teal); background: var(--teal-bg); }
  .c-gray { color: var(--muted); background: var(--sunk); }

  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }

  /* ---- Chat header */
  .chat-head { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  .chat-head .info { min-width: 0; flex: 1; }
  .chat-head .title { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-head .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .back { display: none; border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer; color: var(--blue); }
  @media (max-width: 760px) { .back { display: block; } }
  .steps { display: flex; gap: 3px; margin-top: 6px; max-width: 520px; }
  .steps span { flex: 1; text-align: center; font-size: 11px; padding: 2px 0; border-radius: 4px; background: var(--sunk); color: var(--muted); }
  .steps span.done { background: var(--green-bg); color: var(--green); }
  .steps span.current { background: var(--blue); color: #fff; font-weight: 600; }
  .steps span.current.paused { background: var(--gray); }

  /* ---- Messages */
  .msgs { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 8px; }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 760px; margin-top: 14px; }
  .msg.cont { margin-top: 3px; }
  .msg.cont .av { visibility: hidden; height: 0; }
  .msg.mine { margin-left: auto; flex-direction: row-reverse; }
  .msg .col { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .msg.mine .col { align-items: flex-end; }
  .msg .who { font-size: 12px; color: var(--muted); margin: 0 4px 3px; }
  .msg .who b { color: var(--ink); font-weight: 600; }
  .msg .who .on-task { color: var(--blue); }
  .bubble { max-width: 100%; padding: 8px 12px; border-radius: 16px; border-bottom-left-radius: 5px; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg.mine .bubble { background: var(--mine); color: var(--mine-ink); border-color: transparent; border-radius: 16px; border-bottom-right-radius: 5px; }
  .bubble.good { background: var(--green-bg); border-color: transparent; }
  .bubble.warn { background: var(--amber-bg); border-color: transparent; }
  .bubble.bad { background: var(--red-bg); border-color: transparent; }
  .bubble .lead { font-weight: 600; }
  .bubble code { background: var(--sunk); padding: 0 4px; border-radius: 4px; }
  .msg.mine .bubble code { background: rgb(255 255 255 / .18); }
  .bubble ul { margin: 6px 0 0; padding-left: 18px; white-space: normal; }
  .bubble li { margin: 3px 0; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7; overflow: hidden; }
  .more { margin: 3px 6px 0; border: 0; background: none; padding: 0; color: var(--blue); font-size: 13px; cursor: pointer; }
  .msg.mine .more { color: var(--blue); }
  .stamp { font-size: 11px; color: var(--muted); margin: 3px 6px 0; }

  .note { text-align: center; margin: 14px auto 0; max-width: 560px; font-size: 12px; color: var(--muted); }
  .note span { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--sunk); }
  .note.intro span { border-radius: 12px; padding: 8px 14px; text-align: left; font-size: 13px; }
  .fresh .bubble, .note.fresh span { animation: flash 2.5s; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--blue); } }
  .empty { margin: 40px auto; text-align: center; color: var(--muted); max-width: 420px; }

  /* ---- Live "typing" lines and the read-only composer */
  .typing { padding: 0 16px; }
  .typing .t { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 4px 0; overflow: hidden; }
  .typing .t .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dots { display: inline-flex; gap: 3px; padding: 6px 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); flex: none; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 30% { transform: translateY(-3px); opacity: 1; } 0%, 60%, 100% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .dots i, .dot.on, .fresh .bubble, .note.fresh span { animation: none; } }
  .composer { margin: 8px 16px 12px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <h1 id="run">Crew</h1>
  <span id="cost" class="muted"></span>
  <span class="live"><span id="dot" class="dot"></span><span id="status">connecting…</span></span>
  <div class="modes" role="group" aria-label="Level of detail">
    <button type="button" data-mode="simple">Simple</button>
    <button type="button" data-mode="tech">Technical</button>
  </div>
</header>
<div id="app" class="app">
  <nav id="list" class="list" aria-label="Runs and conversations"></nav>
  <section class="chat" aria-label="Conversation">
    <div id="head" class="chat-head"></div>
    <div id="msgs" class="msgs"></div>
    <div id="typing" class="typing"></div>
    <div id="composer" class="composer"></div>
  </section>
</div>
<script>
// Everything from the run is rendered with textContent: logs and agent output can contain anything.
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const ago = (iso) => {
  if (!iso) return '';
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
};
const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const money = (n) => `$${(n ?? 0).toFixed(2)}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const store = (key, value) => { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch { /* storage blocked: not remembered */ } return null; };

// ---- Level of detail. "simple" is for anyone; "tech" adds ids, models, commands, files and exit codes.
let mode = store('crew-mode') === 'tech' ? 'tech' : 'simple';
const tech = () => mode === 'tech';
for (const b of document.querySelectorAll('.modes button')) {
  b.onclick = () => { mode = b.dataset.mode; store('crew-mode', mode); render(); };
}

// ---- Who talks. The boss is "you" (your Claude Code session), so its messages sit on the right.
const WHO = {
  boss: { name: ['Lead AI', 'Boss'], letter: 'B', color: 'blue', mine: true },
  orchestrator: { name: ['Scheduler', 'Orchestrator'], letter: 'O', color: 'gray' },
  driver: { name: ['Coordinator', 'Driver'], letter: 'D', color: 'gray' },
  coder: { name: ['Developer', 'Coder'], letter: 'C', color: 'violet' },
  reviewer: { name: ['Reviewer', 'Reviewer'], letter: 'R', color: 'teal' },
  checks: { name: ['Tests', 'Checks'], letter: '✓', color: 'green' },
  triage: { name: ['Troubleshooter', 'Triage'], letter: 'T', color: 'amber' },
};
const who = (from) => WHO[from] ?? WHO.driver;
const nameOf = (from) => who(from).name[tech() ? 1 : 0];
const at = (from) => `@${nameOf(from)}`;

// ---- Task state (unchanged from the card dashboard).
const STEPS_SIMPLE = [['Getting ready', ['prepare']], ['Building', ['code']], ['Testing', ['verify']], ['Reviewing', ['review']], ['Finishing', ['sync', 'publish', 'ci', 'handoff']]];
const STEP_TECH = { prepare: 'Setup', code: 'Code', verify: 'Checks', review: 'Review', sync: 'Sync', publish: 'Push', ci: 'CI', handoff: 'Report' };
const DOING = {
  prepare: ['Getting a private copy of the project ready', 'Setting up the worktree'],
  code: ['Building', 'Writing code'],
  verify: ['Running the automatic tests', 'Running the checks'],
  review: ['Reviewing the work', 'Reviewing the change'],
  sync: ['Catching up with the latest version of the project', 'Bringing in the latest base branch'],
  publish: ['Packaging the change for approval', 'Pushing the branch and opening the PR'],
  ci: ['Running the final test suite', 'Waiting for CI'],
  handoff: ['Writing a summary of the work', 'Writing the hand-off report'],
};
// state → [simple label, tech label, tone]
const STATE = {
  ready_to_merge: ['Ready to ship', 'Ready to merge', 'amber'],
  needs_replan: ['Needs attention', 'Needs a new plan', 'amber'],
  escalate: ['Needs attention', 'Needs a decision', 'amber'],
  help: ['Fixing a hiccup', 'Asked for help', 'amber'],
  merged: ['Shipped', 'Merged', 'green'],
  needs_human: ['Shipped', 'Done', 'green'],
  blocked: ['Stuck', 'Blocked', 'red'],
  abandoned: ['Dropped', 'Abandoned', 'red'],
};
const FINISHED = new Set(['merged', 'needs_human', 'blocked', 'abandoned']);
const DONE_FOR_DEPENDANTS = new Set(['merged', 'needs_human']);

let snap = null;  // the open run's snapshot (null while loading or when there are no runs)
let runs = [];     // every run, newest first: { id, updated, batches, tasks, finished, waiting, active }
let runId = store('crew-run') || '';
let titles = {};
const titleOf = (id) => titles[id] ?? id;

function describe(t, states) {
  const st = STATE[t.state];
  if (st) return { label: tech() ? st[1] : st[0], tone: st[2], kind: FINISHED.has(t.state) ? 'finished' : 'attn' };
  if (!t.phase) {
    const blockedBy = t.depends_on.filter((d) => !DONE_FOR_DEPENDANTS.has(states[d]));
    return { label: tech() ? (blockedBy.length ? 'Waiting' : 'Queued') : 'Up next', tone: 'gray', kind: 'queued',
      note: blockedBy.length
        ? `Starts after ${blockedBy.map((d) => tech() ? d : `“${titleOf(d)}”`).join(' and ')} ${tech() ? (blockedBy.length > 1 ? 'are merged' : 'is merged') : (blockedBy.length > 1 ? 'ship' : 'ships')}.`
        : tech() ? 'Starts when a slot frees up.' : 'Starts as soon as the team has room.' };
  }
  return t.driver?.alive
    ? { label: tech() ? 'Working' : 'In progress', tone: 'blue', kind: 'working' }
    : { label: 'Paused', tone: 'gray', kind: 'paused', note: tech() ? 'The driver is not running. The orchestrator restarts it on its next check.' : 'Briefly paused. It restarts on its own.' };
}

// Agents work inside `.worktrees/<task>/`; that prefix is noise when reading what they do.
const shortPaths = (text) => String(text ?? '').replace(/\/\S*?\/\.worktrees\/[^/\s]+\/?/g, '');

// ---- Turning the run's events into a conversation. Each message: { key, ts, task, from, lead, text, items, tone, note }.
function conversation(t) {
  const out = [];
  const say = (m, from, fields) => out.push({ key: `${t.id}|${m.ts}|${m.type}|${out.length}`, ts: m.ts, task: t.id, from, ...fields });
  const legacy = !t.talk.some((m) => m.type === 'checks'); // runs from before the driver reported its checks
  let waitingOnChecks = false;
  for (const m of t.talk) {
    if (!out.length) {
      say(m, 'boss', {
        lead: tech() ? `${t.id}${t.version > 1 ? ` (plan v${t.version})` : ''}: ${t.title ?? ''}` : `New task: “${t.title ?? t.id}”`,
        text: [t.brief, `${at('coder')}, it’s yours. ${at('reviewer')} signs it off.`].filter(Boolean).join('\n\n'),
      });
    }
    const reason = m.reason ? shortPaths(m.reason) : null;
    switch (m.type) {
      case 'driver_launched':
        if (m.reason !== 'start') say(m, 'orchestrator', { note: true, text: m.reason === 'replanned' ? (tech() ? 'Driver restarted on the new plan' : 'Starting again with the new plan') : (tech() ? `Driver launched (${m.reason ?? 'start'})` : 'Picked the work back up') });
        else say(m, 'orchestrator', { note: true, text: tech() ? 'Driver launched' : 'Work started' });
        break;
      case 'driver_restarted':
        say(m, 'orchestrator', { note: true, text: tech() ? `Driver restarted${reason ? `: ${reason}` : ''}` : 'Restarted after a hiccup' });
        break;
      case 'round':
        if (m.step === 'coder') {
          if (legacy && waitingOnChecks) say(m, 'driver', { note: true, text: tech() ? 'Checks failed; sent back to the coder' : 'The automatic tests didn’t pass yet; back to the developer' });
          waitingOnChecks = true;
          const status = m.status && m.status !== 'implemented' ? m.status.replace(/_/g, ' ') : null;
          say(m, 'coder', { lead: tech() ? `Round ${m.round}${status ? ` · ${status}` : ' · done'}` : `Attempt ${m.round}${status ? `: ${status}` : ' is ready'}`,
            text: shortPaths(m.summary ?? reason ?? ''), tone: status ? 'warn' : null });
        } else if (m.step === 'reviewer') {
          waitingOnChecks = false;
          say(m, 'reviewer', reviewMessage(m));
        }
        break;
      case 'checks': {
        waitingOnChecks = false;
        const total = (m.passed?.length ?? 0) + (m.failed?.length ?? 0);
        if (m.failed?.length) {
          say(m, 'checks', { tone: 'bad',
            lead: tech() ? `✗ ${m.failed.length} of ${total} failed` : `${m.failed.length} of ${plural(total, 'automatic test')} didn’t pass`,
            text: tech() ? `${m.failed.map((f) => `${f.id} (exit ${f.code})`).join(', ')}. ${at('coder')}, back to you.` : `${at('coder')}, back to you.` });
        } else {
          say(m, 'checks', { tone: 'good', lead: tech() ? `✓ All ${total} checks passed` : `All ${plural(total, 'automatic test')} passed`, text: `${at('reviewer')}, your turn.` });
        }
        break;
      }
      case 'needs_replan':
        say(m, m.by === 'boss' ? 'boss' : 'driver', { tone: 'warn', lead: `${at('boss')} ${tech() ? 'this needs a new plan' : 'we need a new plan for this one'}`, text: reason ?? '', items: tech() ? m.findings : null });
        break;
      case 'replanned':
        say(m, 'boss', { lead: tech() ? 'Plan revised' : 'I adjusted the plan', text: `${reason ?? ''}\n\n${at('coder')}, please pick it up again.`.trim() });
        break;
      case 'ready_to_merge':
        say(m, 'driver', { tone: 'good', lead: `${at('boss')} ${tech() ? 'ready to merge' : 'it’s ready to ship'}`,
          text: tech()
            ? [`Approved in ${plural(m.rounds ?? 1, 'round')}`, m.pr ? `PR #${m.pr}` : null, m.cost_usd != null ? money(m.cost_usd) : null, m.dry_run ? 'dry run' : null].filter(Boolean).join(' · ')
            : `Passed every test and review${m.rounds > 1 ? ` after ${m.rounds} attempts` : ' on the first try'}.` });
        break;
      case 'merged':
        say(m, 'boss', { tone: 'good', lead: tech() ? 'Merged' : 'Shipped. Thanks, team!' });
        break;
      case 'needs_human':
        say(m, 'boss', { tone: 'good', lead: tech() ? 'Merged' : 'Shipped', text: tech() ? 'The issue stays open for a person to close.' : 'A person will close the request.' });
        break;
      case 'rebase_needed':
        say(m, 'boss', { lead: tech() ? 'The base moved: sync and re-check' : 'Newer work landed. Please catch up and re-test.', text: reason ?? '' });
        break;
      case 'help':
        say(m, m.by === 'orchestrator' ? 'orchestrator' : 'driver', { tone: 'warn', lead: tech() ? 'Something broke in the environment' : 'Something in the setup broke', text: reason ?? '' });
        break;
      case 'triage':
        say(m, 'triage', { lead: tech() ? 'Triage' : 'I looked into it', text: reason ?? '' });
        break;
      case 'retry':
        say(m, 'boss', { lead: tech() ? 'Retry' : 'Try again', text: reason ?? '' });
        break;
      case 'escalate':
        say(m, m.by === 'boss' ? 'boss' : 'driver', { tone: 'warn', lead: `${at('boss')} ${tech() ? 'I need a decision' : 'I need you to decide how to continue'}`, text: reason ?? '' });
        break;
      case 'blocked':
        say(m, m.by === 'driver' ? 'driver' : 'boss', { tone: 'bad', lead: tech() ? 'Blocked' : 'Stuck: this needs a person', text: reason ?? '' });
        break;
      case 'abandoned':
        say(m, 'boss', { tone: 'bad', lead: tech() ? 'Abandoned' : 'Dropping this task', text: reason ?? '' });
        break;
      default:
        say(m, m.by in WHO ? m.by : 'driver', { note: true, text: m.type.replace(/_/g, ' ') + (reason ? `: ${reason}` : '') });
    }
  }
  return out;
}

function reviewMessage(m) {
  const r = m.review;
  if (m.verdict === 'approve') {
    const notes = r?.notes ? (tech() ? ` ${plural(r.notes, 'non-blocking note')} in the report.` : ` I left ${plural(r.notes, 'small suggestion')} for later.`) : '';
    return { tone: 'good', lead: tech() ? `Round ${m.round} · approved` : 'Approved. Looks good to me.', text: notes.trim() };
  }
  if (m.verdict === 'needs_replan') return { tone: 'warn', lead: `${at('boss')} ${tech() ? 'the contract needs a new plan' : 'the plan itself needs changing'}`, text: shortPaths(m.reason ?? '') };
  const items = [];
  for (const f of r?.blocking ?? []) items.push(tech() ? `[${f.severity}] ${f.file ? `${shortPaths(f.file)}${f.line ? `:${f.line}` : ''} — ` : ''}${f.problem}` : f.problem);
  for (const a of r?.failed_acs ?? []) items.push(tech() ? `acceptance ${a}` : a.replace(/^[^:]+:\s*/, ''));
  const still = r?.still_open?.length ? (tech() ? `Still open from last round: ${r.still_open.join(', ')}.` : `${plural(r.still_open.length, 'earlier point')} not fixed yet.`) : '';
  return { tone: 'warn', lead: tech() ? `Round ${m.round} · changes requested${m.open ? ` (${m.open} open)` : ''}` : 'A few changes, please:',
    text: [still, `${at('coder')}, back to you.`].filter(Boolean).join(' '), items: items.length ? items : null };
}

// The run-wide channel: every task's messages in time order, plus batches starting and finishing.
function everyone(s, tasks) {
  const msgs = tasks.flatMap((t) => conversation(t));
  for (const m of s.talk) {
    msgs.push({ key: `run|${m.ts}|${m.type}|${m.batch}`, ts: m.ts, from: 'orchestrator', note: true,
      text: m.type === 'batch_done' ? (tech() ? `Batch “${m.batch}” finished` : `Workstream “${m.batch}” finished`) : (tech() ? `Orchestrator for “${m.batch}” started` : `Workstream “${m.batch}” started`) });
  }
  return msgs.sort((a, b) => a.ts.localeCompare(b.ts));
}

// What someone is doing right now, as a "typing" line: [speaker, text] or null.
function typing(t) {
  if (!t.driver?.alive) return null;
  const role = t.child && t.activity && !t.activity.done ? t.activity.role : null;
  if (role) {
    const detail = tech() && t.activity.last ? ` · ${t.activity.steps} tool calls · ${shortPaths(t.activity.last.text)}` : ` · ${plural(t.activity.steps, 'step')} so far`;
    return [role, `${nameOf(role)} is ${role === 'coder' ? (tech() ? 'coding' : 'building') : 'reviewing'}${detail}`];
  }
  const step = t.step?.text ?? '';
  let m = step.match(/^check (\S+?):/);
  if (m) return ['checks', tech() ? `Checks running ${m[1]} · ${ago(t.step.at)}` : 'Running the automatic tests'];
  m = step.match(/^e2e (\w+) (.+)$/);
  if (m) return ['checks', tech() ? `End-to-end on ${m[1]}: ${m[2].split('/').pop()}` : 'Trying it out on a simulated phone'];
  return ['driver', `${nameOf('driver')}: ${(DOING[t.phase] ?? [t.phase, t.phase])[tech() ? 1 : 0]}`];
}

// ---- Selection, unread counts and expanded messages are per-viewer and in memory (selection is remembered).
// Unread counts and "fresh" highlights are for the open run only; opening another run starts them over.
let current = store('crew-chat') || 'all';
let readUpTo = {}; // conversation → messages already seen
let expanded = new Set();
let seenKeys = null;
let lastShown = null;
let shownRun = null;

function resetRunView() {
  readUpTo = {};
  expanded = new Set();
  seenKeys = null;
  lastShown = null;
}

function select(id) {
  current = id;
  store('crew-chat', id);
  document.getElementById('app').classList.add('reading');
  render();
}

function openRun(id) {
  if (id === runId) return select('all');
  runId = id;
  store('crew-run', id);
  current = 'all';
  store('crew-chat', 'all');
  snap = null;
  connect();
  document.getElementById('app').classList.add('reading');
  render();
}
document.getElementById('app').classList.toggle('reading', !matchMedia('(max-width: 760px)').matches);

// Run ids look like "20260101-truncate-titles"; in simple mode show "Truncate titles" and the date beside it.
function runName(id) {
  if (tech()) return id;
  const m = id.match(/^\d{8}(?:-\d{4,6})?-(.+)$/);
  const words = (m ? m[1] : id).replace(/[-_]+/g, ' ').trim();
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function render() {
  const s = snap;
  for (const b of document.querySelectorAll('.modes button')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  const waitingAll = runs.reduce((n, r) => n + r.waiting, 0);
  document.title = waitingAll ? `(${waitingAll}) Crew` : 'Crew';
  document.getElementById('run').textContent = tech() ? 'Crew' : 'AI team chat';
  if (!s) return renderNoRun();
  const tasks = s.batches.flatMap((b) => b.tasks);
  titles = Object.fromEntries(tasks.map((t) => [t.id, t.title ?? t.id]));
  const states = Object.fromEntries(tasks.map((t) => [t.id, t.state]));
  const desc = Object.fromEntries(tasks.map((t) => [t.id, describe(t, states)]));
  if (current !== 'all' && !titles[current]) current = 'all';
  if (shownRun !== s.run) { resetRunView(); shownRun = s.run; }

  document.getElementById('cost').textContent = tech() ? `${money(s.cost)} spent on ${s.run}` : `${money(s.cost)} in AI costs on this run so far`;

  const convs = { all: everyone(s, tasks) };
  for (const t of tasks) convs[t.id] = conversation(t);
  if (!seenKeys) for (const [id, list] of Object.entries(convs)) readUpTo[id] = list.length; // first load: nothing is unread
  readUpTo[current] = convs[current].length;

  renderList(s, tasks, desc, convs);
  renderHead(s, tasks, desc);
  renderMessages(convs[current], current === 'all', current === 'all' ? 'Nobody has said anything yet.' : desc[current].note ?? 'This task hasn’t started yet.');
  renderTyping(current === 'all' ? tasks : tasks.filter((t) => t.id === current), current === 'all');
  document.getElementById('composer').textContent = tech()
    ? 'Read-only. Talk to the crew through the boss in your Claude Code session.'
    : 'You’re watching. To step in, ask the lead AI in Claude Code.';
}

// Shown while the open run loads, or when there is no run yet: just the list of runs.
function renderNoRun() {
  document.getElementById('cost').textContent = '';
  renderList(null);
  const head = document.getElementById('head');
  head.replaceChildren();
  const info = el('div', 'info');
  info.append(el('div', 'title', runId ? runName(runId) : tech() ? 'No runs' : 'Nothing here yet'));
  head.append(info);
  const box = document.getElementById('msgs');
  box.replaceChildren(el('div', 'empty', runId ? 'Loading…' : tech()
    ? 'No runs in the state dir yet. Start one with /crew in Claude Code; it shows up here on its own.'
    : 'The AI team hasn’t started any work yet. Ask the lead AI in Claude Code to start, and it appears here.'));
  document.getElementById('typing').replaceChildren();
  document.getElementById('composer').textContent = tech()
    ? 'Read-only. Talk to the crew through the boss in your Claude Code session.'
    : 'You’re watching. To step in, ask the lead AI in Claude Code.';
}

function convRow(id, { avatar, name, when, preview, typingNow, unread, pill, cls, onclick, selected, open }) {
  const b = el('button', `conv${cls ? ` ${cls}` : ''}`);
  b.type = 'button';
  b.setAttribute('aria-current', String(selected ?? id === current));
  if (open != null) b.setAttribute('aria-expanded', String(open));
  b.onclick = onclick ?? (() => select(id));
  const top = el('div', 'side');
  top.append(el('span', 'when', when ?? ''));
  const nameEl = el('div', 'name');
  nameEl.append(name);
  b.append(avatar, nameEl, top, el('div', `prev${typingNow ? ' typing' : ''}`, preview ?? ''));
  const side = el('div', 'side');
  if (pill) side.append(pill);
  if (unread > 0) side.append(el('span', 'badge', String(unread)));
  b.append(side);
  return b;
}

function previewOf(msg) {
  if (!msg) return '';
  return `${nameOf(msg.from)}: ${msg.lead ?? msg.text ?? ''}`.split('\n')[0];
}

// The thread list: every run, and under the open one its "everyone" channel, batches and tasks.
function renderList(s, tasks, desc, convs) {
  const list = document.getElementById('list');
  list.replaceChildren(el('div', 'group', tech() ? 'Runs' : 'Projects'));
  for (const r of runs) {
    const isOpen = r.id === runId;
    const tone = r.waiting ? 'amber' : r.active ? 'blue' : r.tasks && r.finished === r.tasks ? 'green' : 'gray';
    const parts = [r.tasks ? `${r.finished} of ${plural(r.tasks, 'task')} ${tech() ? 'finished' : 'done'}` : (tech() ? 'planning' : 'Being planned'),
      r.waiting ? `${r.waiting} ${tech() ? 'waiting on the boss' : (r.waiting === 1 ? 'needs a decision' : 'need a decision')}` : null];
    const name = el('span');
    name.append(el('span', 'chev', isOpen ? '▾' : '▸'), document.createTextNode(` ${runName(r.id)}`));
    list.append(convRow(r.id, {
      cls: 'run', open: isOpen, selected: isOpen && current === 'all', onclick: () => openRun(r.id),
      avatar: el('div', `av c-gray ring-${tone}`, initials(runName(r.id))), name,
      when: ago(r.updated), preview: parts.filter(Boolean).join(' · '),
      pill: r.active ? el('span', 'pill c-blue', tech() ? 'running' : 'active') : null,
    }));
    if (isOpen) {
      const thread = el('div', 'thread');
      if (s) renderThread(thread, s, tasks, desc, convs);
      else thread.append(el('div', 'group', 'Loading…'));
      list.append(thread);
    }
  }
}

function renderThread(list, s, tasks, desc, convs) {
  if (s.waiting.length) {
    list.append(el('div', 'waiting', `${tech() ? 'Waiting on the boss' : 'Needs a decision'}: ${s.waiting.map((w) => tech() ? w.id : `“${titleOf(w.id)}”`).join(', ')}`));
  }
  const allMsgs = convs.all;
  const working = tasks.filter((t) => desc[t.id].kind === 'working').length;
  list.append(convRow('all', {
    avatar: el('div', 'av c-blue', '#'), name: tech() ? 'everyone' : 'Everyone',
    when: allMsgs.length ? clock(allMsgs.at(-1).ts) : '',
    preview: working ? `${plural(working, 'task')} in progress` : previewOf(allMsgs.at(-1)), typingNow: working > 0,
    unread: allMsgs.length - (readUpTo.all ?? 0),
  }));
  for (const b of s.batches) {
    const head = el('div', 'group');
    const allDone = b.tasks.every((t) => FINISHED.has(t.state));
    const state = b.orchestrator?.alive ? ['blue', tech() ? 'running' : 'active'] : allDone ? ['green', 'finished'] : ['gray', tech() ? 'stopped' : 'paused'];
    head.append(el('span', null, `${tech() ? 'Batch' : 'Workstream'} · ${b.name}${b.dry_run ? (tech() ? ' · dry run' : ' · practice') : ''}`), el('span', `pill c-${state[0]}`, state[1]));
    list.append(head);
    // Most recent conversation first, queued tasks (no messages yet) last.
    const lastTs = (t) => convs[t.id].at(-1)?.ts ?? '';
    for (const t of [...b.tasks].sort((x, y) => lastTs(y).localeCompare(lastTs(x)))) {
      const d = desc[t.id];
      const msgs = convs[t.id];
      const live = d.kind === 'working' ? typing(t) : null;
      list.append(convRow(t.id, {
        avatar: el('div', `av c-gray ring-${d.tone}`, initials(t.title ?? t.id)),
        name: t.title ?? t.id, when: msgs.length ? clock(msgs.at(-1).ts) : '',
        preview: live ? `${nameOf(live[0])} is typing…` : msgs.length ? previewOf(msgs.at(-1)) : d.note ?? d.label,
        typingNow: !!live, unread: msgs.length - (readUpTo[t.id] ?? 0),
        pill: d.kind === 'working' ? null : el('span', `pill c-${d.tone}`, d.label),
      }));
    }
  }
}

const initials = (title) => title.split(/[\s:·-]+/).filter((w) => /^[\p{L}\p{N}]/u.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';

function renderHead(s, tasks, desc) {
  const head = document.getElementById('head');
  head.replaceChildren();
  const back = el('button', 'back', '‹');
  back.type = 'button';
  back.setAttribute('aria-label', 'Back to conversations');
  back.onclick = () => document.getElementById('app').classList.remove('reading');
  head.append(back);
  const info = el('div', 'info');
  if (current === 'all') {
    const count = (k) => tasks.filter((t) => desc[t.id].kind === k).length;
    head.append(el('div', 'av sm c-blue', '#'));
    info.append(el('div', 'title', tech() ? 'everyone' : 'Everyone'));
    const parts = tech()
      ? [[count('working'), 'working'], [count('attn'), 'need the boss'], [count('queued') + count('paused'), 'waiting'], [count('finished'), 'finished']]
      : [[count('working'), 'in progress'], [count('attn'), 'need a decision'], [count('queued') + count('paused'), 'up next'], [count('finished'), 'done']];
    info.append(el('div', 'sub', parts.map(([n, l]) => `${n} ${l}`).join(' · ')));
    head.append(info);
    return;
  }
  const t = tasks.find((x) => x.id === current);
  const d = desc[t.id];
  head.append(el('div', `av sm c-gray ring-${d.tone}`, initials(t.title ?? t.id)));
  const title = el('div', 'title', t.title ?? t.id);
  info.append(title);
  const round = t.round ?? 1;
  const sub = tech()
    ? [t.id, t.issue != null ? `issue #${t.issue}` : null, t.version > 1 ? `plan v${t.version}` : null, `coder ${t.models?.coder ?? '?'} → reviewer ${t.models?.reviewer ?? '?'}`,
      t.phase ? `round ${round}/${t.max_rounds}` : null, money(t.cost), t.pr ? `PR #${t.pr}` : null, t.head ? `commit ${t.head}` : null, t.restarts ? `restarted ${t.restarts}×` : null]
    : [t.issue != null ? `Request #${t.issue}` : null, t.phase && !FINISHED.has(t.state) ? `attempt ${round} of ${t.max_rounds}` : null, money(t.cost), d.note ?? null];
  info.append(el('div', 'sub', sub.filter(Boolean).join(' · ')));
  if (t.phase && !FINISHED.has(t.state)) {
    const steps = el('div', 'steps');
    const pos = t.phase === 'ready_to_merge' ? s.phases.length : s.phases.indexOf(t.phase);
    const stepList = tech()
      ? s.phases.map((p, i) => [STEP_TECH[p] ?? p, i, i])
      : STEPS_SIMPLE.map(([label, phases]) => {
        const idx = phases.map((p) => s.phases.indexOf(p)).filter((i) => i >= 0);
        return [label, Math.min(...idx), Math.max(...idx)];
      });
    for (const [label, first, last] of stepList) steps.append(el('span', pos > last ? 'done' : pos >= first ? `current${d.kind === 'working' ? '' : ' paused'}` : '', label));
    info.append(steps);
  }
  head.append(info, el('span', `pill c-${d.tone}`, d.label));
}

// Light formatting for agent text: **bold** and `code`, built as nodes (never HTML).
function rich(parent, text) {
  for (const part of String(text).split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/)) {
    if (!part) continue;
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4) parent.append(el('b', null, part.slice(2, -2)));
    else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) parent.append(el('code', null, part.slice(1, -1)));
    else parent.append(document.createTextNode(part));
  }
}

function renderMessages(msgs, inEveryone, emptyText) {
  const box = document.getElementById('msgs');
  const switched = lastShown !== `${current}|${mode}`;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const keep = box.scrollTop;
  box.replaceChildren();
  if (!tech() && inEveryone) {
    const intro = el('div', 'note intro');
    intro.append(el('span', null, 'How this works: the lead AI splits the work into tasks. In each task, an AI developer builds it, automatic tests check it, and a separate AI reviewer must approve it before it ships. Pick a task on the left to read its conversation.'));
    box.append(intro);
  }
  if (!msgs.length) box.append(el('div', 'empty', emptyText));
  let prev = null;
  for (const m of msgs) {
    const fresh = seenKeys && !seenKeys.has(m.key) ? ' fresh' : '';
    if (m.note) {
      const n = el('div', `note${fresh}`);
      n.append(el('span', null, `${inEveryone && m.task ? `${titleOf(m.task)} · ` : ''}${m.text} · ${clock(m.ts)}`));
      box.append(n);
      prev = null;
      continue;
    }
    const w = who(m.from);
    const cont = prev && prev.from === m.from && prev.task === m.task && Date.parse(m.ts) - Date.parse(prev.ts) < 5 * 60_000;
    const row = el('div', `msg${w.mine ? ' mine' : ''}${cont ? ' cont' : ''}${fresh}`);
    row.append(el('div', `av sm c-${w.color}`, w.letter));
    const col = el('div', 'col');
    if (!cont) {
      const label = el('div', 'who');
      label.append(el('b', null, nameOf(m.from)));
      const model = tech() && (m.from === 'coder' || m.from === 'reviewer') ? snap.batches.flatMap((b) => b.tasks).find((t) => t.id === m.task)?.models?.[m.from] : null;
      if (model) label.append(document.createTextNode(` · ${model}`));
      if (inEveryone && m.task) { label.append(document.createTextNode(' in ')); label.append(el('span', 'on-task', titleOf(m.task))); }
      col.append(label);
    }
    const bubble = el('div', `bubble${m.tone && !w.mine ? ` ${m.tone}` : ''}`);
    if (m.lead) bubble.append(el('div', 'lead', m.lead));
    const long = (m.text?.length ?? 0) > 420 || (m.items?.length ?? 0) > 4;
    const open = expanded.has(m.key);
    if (m.text) {
      const body = el('div', long && !open ? 'clamp' : null);
      rich(body, m.text);
      bubble.append(body);
    }
    if (m.items?.length) {
      const ul = el('ul');
      for (const item of open || !long ? m.items : m.items.slice(0, 3)) { const li = el('li'); rich(li, shortPaths(item)); ul.append(li); }
      bubble.append(ul);
    }
    col.append(bubble);
    if (long) {
      const more = el('button', 'more', open ? 'Show less' : 'Show more');
      more.type = 'button';
      more.setAttribute('aria-expanded', String(open));
      more.onclick = () => { open ? expanded.delete(m.key) : expanded.add(m.key); render(); };
      col.append(more);
    }
    col.append(el('div', 'stamp', clock(m.ts)));
    row.append(col);
    box.append(row);
    prev = m;
  }
  seenKeys = new Set([...(seenKeys ?? []), ...msgs.map((m) => m.key)]);
  if (switched || atBottom) box.scrollTop = box.scrollHeight;
  else box.scrollTop = keep;
  lastShown = `${current}|${mode}`;
}

function renderTyping(tasks, inEveryone) {
  const box = document.getElementById('typing');
  box.replaceChildren();
  for (const t of tasks) {
    const live = typing(t);
    if (!live) continue;
    const line = el('div', 't');
    const dots = el('span', 'dots');
    dots.append(el('i'), el('i'), el('i'));
    line.append(dots, el('span', 'txt', `${inEveryone ? `${titleOf(t.id)}: ` : ''}${live[1]}`));
    box.append(line);
  }
}

// One stream for the open run. The server sends the run list too, so new runs show up without reloading.
const dot = document.getElementById('dot');
const status = document.getElementById('status');
let stream = null;
function connect() {
  stream?.close();
  stream = new EventSource(`/stream?run=${encodeURIComponent(runId)}`);
  stream.onmessage = (m) => {
    const p = JSON.parse(m.data);
    runs = p.runs;
    // The server falls back to the newest run when the asked-for one is gone (or none was asked for).
    if (p.run !== runId) { runId = p.run ?? ''; if (p.run) store('crew-run', p.run); current = 'all'; }
    dot.classList.add('on');
    status.textContent = 'live';
    if (p.snapshot?.error) { status.textContent = p.snapshot.error; snap = null; }
    else snap = p.snapshot;
    render();
  };
  stream.onerror = () => { dot.classList.remove('on'); status.textContent = 'reconnecting…'; };
}
connect();
// Keep the "x min ago" texts fresh between pushes.
setInterval(render, 5000);
</script>
</body>
</html>
